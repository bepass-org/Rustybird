[package]
name = "rustybird"
version = "0.2.0"
edition = "2024"
authors = ["RustyBird Contributors"]
description = "Mobile-first sing-box client for GNU/Linux built with Rust, GTK4 and Libadwaita"
license = "GPL-3.0-or-later"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
gio = "0.20"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "process", "net", "time", "sync", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
url = "2.5"
percent-encoding = "2.3"
base64 = "0.22"
directories = "5.0"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
